name: Build radaer-native ipk

on:
  workflow_dispatch:
    inputs:
      sdk_target:
        description: "SDK_TARGET (e.g. qualcommax/ipq807x or x86/64)"
        required: false
        default: "qualcommax/ipq807x"
      sdk_file:
        description: "SDK_FILE (full filename)"
        required: false
        default: "openwrt-sdk-24.10.1-qualcommax-ipq807x_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
  push:
    branches: [main, master]

env:
  SDK_VERSION: "24.10.1"
  SDK_TARGET: ${{ github.event.inputs.sdk_target || 'qualcommax/ipq807x' }}
  SDK_FILE: ${{ github.event.inputs.sdk_file || 'openwrt-sdk-24.10.1-qualcommax-ipq807x_gcc-13.3.0_musl.Linux-x86_64.tar.zst' }}
  OPENSSL_VERSION: "3.0.15"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd rsync build-essential file wget perl

      - name: Cache OpenWrt SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: sdk
          key: openwrt-sdk-${{ env.SDK_VERSION }}-${{ env.SDK_FILE }}-musl-v3

      - name: Download OpenWrt SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          FILE="${SDK_FILE}"
          TARGET="${SDK_TARGET}"
          VER="${SDK_VERSION}"
          # 官方源经常 502，按顺序试镜像
          for BASE in \
            "https://downloads.openwrt.org" \
            "https://mirrors.ustc.edu.cn/openwrt" \
            "https://mirror.sjtu.edu.cn/openwrt" \
            "https://mirrors.tuna.tsinghua.edu.cn/openwrt"
          do
            URL="${BASE}/releases/${VER}/targets/${TARGET}/${FILE}"
            echo ">>> trying ${URL}"
            if wget -q --timeout=60 --tries=2 "${URL}" -O sdk.tar.zst 2>/dev/null; then
              if [ -s sdk.tar.zst ] && tar --zstd -tf sdk.tar.zst >/dev/null 2>&1; then
                echo ">>> OK from ${BASE}"
                break
              fi
            fi
            rm -f sdk.tar.zst
          done
          if [ ! -s sdk.tar.zst ]; then
            echo "!!! all mirrors failed for ${FILE}"
            exit 1
          fi
          ls -lh sdk.tar.zst
          rm -rf sdk
          mkdir -p sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          rm -f sdk.tar.zst

      - name: Diagnose SDK layout
        run: |
          set -eux
          echo '=== sdk top ==='
          ls -1 sdk
          echo '=== toolchain ==='
          ls -d sdk/staging_dir/toolchain-* || true
          echo '=== target staging ==='
          ls -d sdk/staging_dir/target-* || true
          echo '=== package tree (maxdepth 2) ==='
          find sdk/package -maxdepth 2 -type d 2>/dev/null | head -40 || echo '(no package dir)'
          echo '=== openssl candidate paths ==='
          for p in sdk/package/libs/openssl sdk/package/feeds/packages/openssl sdk/feeds/packages/libs/openssl; do
            if [ -d "$p" ]; then echo "FOUND: $p"; else echo "missing: $p"; fi
          done

      - name: Build OpenSSL into SDK staging
        run: |
          set -eux
          WS="$GITHUB_WORKSPACE"
          TC=$(ls -d "$WS"/sdk/staging_dir/toolchain-*)
          STAGING=$(ls -d "$WS"/sdk/staging_dir/target-*)
          echo "TC=$TC"
          echo "STAGING=$STAGING"

          # 工具链前缀随架构变化：aarch64-openwrt-linux-musl- / x86_64-openwrt-linux-musl- ...
          # 从 toolchain 目录里自动探测，避免写死导致 x86_64 编译失败。
          PREFIX=$(basename "$(ls "$TC"/bin/*-openwrt-linux-musl-gcc 2>/dev/null | head -1)" | sed 's/gcc$//')
          if [ -z "$PREFIX" ]; then
            echo "!!! cannot detect toolchain prefix in $TC/bin"
            ls "$TC/bin" | head -30
            exit 1
          fi
          echo "PREFIX=$PREFIX"

          # 必须绝对路径：OpenSSL 的 make 会 cd 到 apps/lib 等子目录，
          # 相对路径的 CC 会变成 Error 127 (command not found)。
          export CC="$TC/bin/${PREFIX}gcc"
          export CXX="$TC/bin/${PREFIX}g++"
          export AR="$TC/bin/${PREFIX}gcc-ar"
          export RANLIB="$TC/bin/${PREFIX}gcc-ranlib"
          export NM="$TC/bin/${PREFIX}gcc-nm"
          export CFLAGS="-Os -fPIC -ffunction-sections -fdata-sections"

          # OpenSSL Configure 的 target 名随架构变化
          case "$PREFIX" in
            aarch64-*) OSSL_TARGET="linux-aarch64" ;;
            x86_64-*)  OSSL_TARGET="linux-x86_64" ;;
            arm-*)     OSSL_TARGET="linux-armv4" ;;
            mipsel-*)  OSSL_TARGET="linux-mips32" ;;
            mips-*)    OSSL_TARGET="linux-mips32" ;;
            i386-*)    OSSL_TARGET="linux-elf" ;;
            *)
              echo "!!! unknown arch for OpenSSL: $PREFIX"
              exit 1
              ;;
          esac
          echo "OSSL_TARGET=$OSSL_TARGET"

          cd "$WS"
          wget -q "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"
          tar xf "openssl-${OPENSSL_VERSION}.tar.gz"
          cd "openssl-${OPENSSL_VERSION}"

          ./Configure "$OSSL_TARGET" \
            --prefix="$STAGING/usr" \
            --openssldir=/etc/ssl \
            no-tests no-shared no-async no-engine no-dso no-legacy

          # 只编库，不编 apps（3.0.x 没有 no-apps 选项）
          make -j2 build_libs
          make install_sw

          echo '=== installed ==='
          ls "$STAGING/usr/include/openssl" | head -10
          ls -lh "$STAGING/usr/lib/"libcrypto.* || true

      - name: Build radaer-native
        run: |
          set -eux
          chmod +x openwrt/build-sdk.sh
          sh openwrt/build-sdk.sh "$PWD/sdk" 2

      - name: Collect ipk
        if: always()
        run: |
          set -eux
          mkdir -p out
          find sdk -name 'radaer-native_*.ipk' -exec cp -v {} out/ \; || true
          echo '=== out ==='
          ls -lh out || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radaer-ipk-${{ github.sha }}
          path: out/radaer-native_*.ipk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            sdk/logs/
            openssl-*/config.log
            sdk/build_dir/target-*/radaer-native-*/CMakeFiles/CMakeError.log
            sdk/build_dir/target-*/radaer-native-*/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
          retention-days: 7
